ottom));transform:translate(-50%);width:min(900px,calc(100% - 24px));background:var(--paper);color:var(--ink);border:3px solid var(--wood-dark);box-shadow:inset 0 0 0 3px var(--wood-light),inset 0 0 0 5px var(--wood),0 8px 24px #00000080;padding:12px 14px;border-radius:3px}.blog{font-size:17px;min-height:24px;margin-bottom:8px}.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.cmds button{cursor:pointer;display:grid;text-align:left;gap:1px;background:#fffaf0;border:3px solid var(--paper3);padding:6px 10px;border-radius:2px;color:var(--ink)}.cmds button b{font-size:17px}.cmds button small{font-size:12px;color:var(--ink-soft)}.cmds button:hover:not(:disabled),.cmds button:focus-visible{border-color:var(--fire);background:#fff3da;outline:none}.cmds button:disabled{opacity:.45}.mini{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translate(-50%);width:min(720px,calc(100% - 24px));pointer-events:auto;text-align:center;background:var(--paper);color:var(--ink);border:3px solid var(--wood-dark);box-shadow:inset 0 0 0 3px var(--wood-light),inset 0 0 0 5px var(--wood),0 8px 24px #00000080;padding:12px 16px;border-radius:3px}.mini-title{font-size:20px;font-weight:700;color:var(--fire)}.mini-help{font-size:15px;color:var(--ink-soft);margin-top:2px}.mini-action{font:inherit;font-weight:700;margin-top:8px;min-height:42px;padding:5px 16px;cursor:pointer;touch-action:none;color:#fff4d3;background:#694b3a;border:2px solid var(--wood-dark);box-shadow:inset 0 2px #aa7d52}.mini-action:focus-visible,.mini-action:active{outline:2px solid var(--fire);outline-offset:2px}.mini-action:disabled{opacity:.55}.mini-cancel{font:inherit;font-size:14px;margin:8px 0 0 8px;min-height:42px;padding:5px 12px;cursor:pointer;color:var(--ink);background:var(--paper2);border:2px solid var(--wood)}.mini-cancel:focus-visible,.mini-cancel:hover{outline:2px solid var(--fire);outline-offset:1px}.mini-opts{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}.mini-opts:empty{display:none}.mini-opts button{cursor:pointer;min-width:84px;display:grid;justify-items:center;background:#fffaf0;border:3px solid var(--paper3);border-radius:2px;padding:6px 10px;color:var(--ink)}.mini-opts button b{font:700 30px/1.1 serif;color:var(--wood)}.mini-opts button small{font-size:13px}.mini-opts button:hover,.mini-opts button:focus-visible{border-color:var(--fire);outline:none}@media(max-width:760px){.fpanel{min-width:0;padding:5px;gap:6px}.fpanel canvas{width:34px;height:34px}.fpanel strong{font-size:14px}.fpanel .bars{min-width:110px}.dist{top:calc(max(12px,env(safe-area-inset-top)) + 122px);font-size:12px}.cmds{grid-template-columns:repeat(3,1fr)}.cmds button{padding:4px 6px}.cmds button b{font-size:14px}.cmds button small{display:none}.blog{font-size:14px}}.inbattle .hud,.inbattle .clockbox,.inbattle .menubtn,.inbattle .touch{display:none!important}@media(orientation:portrait){.title{align-content:end;padding-bottom:calc(64px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#080d0ff2,#080d0fd1 42%,#080d0f33 66%,#080d0f00 80%)}.foot{bottom:max(18px,env(safe-area-inset-bottom));right:18px}}@media(max-width:760px){.clockbox{left:max(12px,env(safe-area-inset-left));right:auto;top:calc(max(12px,env(safe-area-inset-top)) + 70px);justify-items:start;max-width:calc(100% - 24px)}#objective{text-align:left}.hud{max-width:calc(100% - 76px)}}</style>
</head>
<body>
<main id="app">
  <canvas id="stage" width="480" height="270" role="img" aria-label="Mundo do jogo"></canvas>

  <!-- Tela de título -->
  <section id="s-title" class="layer title">
    <div class="logo">
      <span class="seal" aria-hidden="true">忍</span>
      <h1><span>Ascensão</span><span>Shinobi</span></h1>
      <p class="tagline">Da Academia Ninja até virar lenda</p>
    </div>
    <nav class="mainmenu" id="mainmenu" aria-label="Menu principal"></nav>
    <p class="foot">v0.4.6 · Academia e Vida Genin · Jogo de fã sem fins lucrativos</p>
  </section>

  <!-- Seleção de jornada -->
  <section id="s-slots" class="layer dim" hidden>
    <div class="panel wood wide">
      <h2 class="ptitle">Escolha sua jornada</h2>
      <div id="slots" class="slots"></div>
      <div class="hint"><button class="ghost" data-back="title">Voltar</button><span id="slot-status" role="status"></span></div>
    </div>
  </section>

  <dialog id="delete-save" class="panel wood save-dialog" aria-labelledby="delete-title" aria-describedby="delete-warning">
    <h2 id="delete-title" class="ptitle">Excluir save</h2>
    <p id="delete-target"></p>
    <p id="delete-warning">O progresso desta jornada será excluído permanentemente deste navegador.</p>
    <form method="dialog" class="actions">
      <button class="ghost" value="cancel" autofocus>Cancelar</button>
      <button class="danger" value="delete">Excluir save</button>
    </form>
  </dialog>

  <!-- Criação de personagem -->
  <section id="s-create" class="layer dim" hidden>
    <form id="form" class="panel wood create" autocomplete="off">
      <div class="pedestal">
        <canvas id="preview" width="96" height="104" aria-label="Prévia do personagem"></canvas>
        <div class="preview-controls">
          <div class="turn"><button type="button" class="ghost sm" id="rotL" aria-label="Girar para a esquerda"><i class="tri l"></i></button><span id="preview-facing" aria-live="polite">Frente</span><button type="button" class="ghost sm" id="rotR" aria-label="Girar para a direita"><i class="tri r"></i></button></div>
          <button type="button" class="ghost sm" id="preview-motion" aria-pressed="false">Ver caminhada</button>
        </div>
      </div>
      <div class="sheet">
        <h2 class="ptitle">Ficha de matrícula</h2>
        <label class="namefield">Nome<input id="f_name" maxlength="16" placeholder="Digite seu nome" required></label>
        <p id="origin" class="origin"></p>
        <div class="tabs" role="tablist" id="ctabs"></div>
        <div id="rows" class="rows"></div>
        <div class="actions"><button type="button" class="ghost" data-back="slots">Voltar</button><button type="button" class="ghost" id="randomize">Sortear aparência</button><button class="primary" type="submit">Começar jornada</button></div>
      </div>
    </form>
  </section>

  <!-- HUD do jogo -->
  <section id="s-game" class="layer hudlayer" hidden>
    <div class="hud">
      <canvas id="hudFace" width="40" height="40" aria-hidden="true"></canvas>
      <div class="hudinfo"><strong id="who"></strong><span id="rank"></span>
        <div class="bars" id="bars"></div></div>
    </div>
    <div class="clockbox"><span id="clock"></span><span id="objective"></span></div>
    <div class="banner" id="banner" aria-live="polite"><span id="bannerRegion"></span><strong id="bannerName"></strong></div>
    <div class="toast" id="toast" hidden></div>
    <button class="menubtn" id="btnMenu" aria-label="Abrir menu"><i></i><i></i><i></i></button>
    <div class="dialogue" id="talk" hidden><canvas id="head" width="40" height="40"></canvas><div class="dtext"><b id="speaker"></b><p id="words"></p><div id="choices" class="choices"></div></div><span class="more" id="next" role="button" aria-label="Avançar"></span></div>
    <div class="touch" id="touch">
      <div class="pad" aria-label="Direcional"><button data-d="up" aria-label="Cima"></button><button data-d="left" aria-label="Esquerda"></button><button data-d="down" aria-label="Baixo"></button><button data-d="right" aria-label="Direita"></button></div>
      <button class="abtn" id="use" aria-label="Interagir">A</button>
    </div>
    <div class="battle" id="battle" hidden>
      <div class="fpanel" data-side="0"><canvas width="40" height="40"></canvas><div><strong></strong><div class="bars"></div><span class="tags"></span></div></div>
      <div class="fpanel right" data-side="1"><canvas width="40" height="40"></canvas><div><strong></strong><div class="bars"></div><span class="tags"></span></div></div>
      <div class="dist"></div>
      <div class="vs"><span class="vs-t"></span><strong class="vs-a"></strong><strong class="vs-b"></strong></div>
      <div class="bpanel"><p class="blog" aria-live="polite"></p><div class="cmds"></div></div>
    </div>
    <div class="mini" id="mini" hidden><p class="mini-title"></p><p class="mini-help"></p><div class="mini-opts"></div><button type="button" id="mini-action" class="mini-action" hidden>A</button><button type="button" id="mini-cancel" class="mini-cancel" hidden>Interromper treino</button></div>
    <div class="fade" id="fade"></div>
  </section>

  <dialog id="menu" class="menu">
    <div class="menuhead"><canvas id="menuFace" width="40" height="40"></canvas><div><h2 id="menuName"></h2><span id="menuSub"></span></div><button id="closeMenu" class="ghost">Voltar ao jogo</button></div>
    <nav class="mtabs" id="tabs"></nav>
    <div id="tabBody" class="tabbody"></div>
  </dialog>
</main>
</body>
</html>
